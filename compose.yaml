services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dust_dev
      POSTGRES_USER: dust_dev
      POSTGRES_PASSWORD: dust_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dust_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dust_dev -d dust_dev"]
      interval: 3s
      timeout: 3s
      retries: 15

  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dust_test
      POSTGRES_USER: dust_test
      POSTGRES_PASSWORD: dust_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dust_test -d dust_test"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  dust_dev_data:
