# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - name: questionair-dust-demo
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: questionair-dust-demo-db
          property: connectionString
databases:
  - name: questionair-dust-demo-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    ipAllowList: []
